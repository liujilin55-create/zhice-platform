<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>知策台｜项目执行系统</title>
  <script>
    if (new URLSearchParams(window.location.search).get('external-background') === '1') {
      document.documentElement.classList.add('external-background');
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root { --bg:#000; --fg:#fff; --pad-x: clamp(20px, 6.95vw, 120px) }
    html, body { height:100%; margin:0; background:#000; color:#fff; font-family:'Noto Sans SC','Microsoft YaHei',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden }
    *, *::before, *::after { box-sizing:border-box }
    .hero { position:relative; width:100%; height:100vh; height:100svh; min-height:520px; overflow:hidden; background:#000 }
    /* The wave layer stays above the black WebGL clear, then uses screen blending
       so the dots read as a luminous background instead of a nearly invisible grid. */
    #waves { position:absolute; inset:0; z-index:2; width:100%; height:100%; display:block; pointer-events:none; opacity:.78; mix-blend-mode:screen }
    #scene { position:absolute; inset:0; z-index:1; width:100%; height:100%; display:block; cursor:grab; touch-action:none }
    #scene.dragging { cursor:grabbing }
    .ui { position:absolute; inset:0; pointer-events:none; z-index:3 }
    .ui a, .ui button { pointer-events:auto }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0 }

    .nav { position:absolute; top:clamp(24px,4.7vh,40px); left:var(--pad-x); right:var(--pad-x); display:flex; align-items:center; justify-content:space-between }
    .logo { display:flex; align-items:center; gap:8px; color:#fff; text-decoration:none; font-size:15px; letter-spacing:-0.01em }
    .logo-mark { width:20px; height:40px; background:#fff; border-radius:0 20px 20px 0 }
    .logo b { font-weight:700 } .logo span { font-weight:400 }
    .nav-links { display:flex; gap:clamp(20px,4.1vw,60px); list-style:none; padding:0; margin:0 }
    .nav-links a { color:#fff; text-decoration:none; font-size:15px; font-weight:500; position:relative; cursor:pointer }
    .nav-links a::after { content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .35s ease }
    .nav-links a:hover::after, .nav-links a:focus-visible::after { transform:scaleX(1); transform-origin:left }

    .arrows { position:absolute; top:18.9%; left:76.7%; display:flex; gap:32px; transform:translate(-19px,-50%) }
    .arrow { width:38px; height:38px; border-radius:50%; border:2.5px solid #fff; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer; transition:background .25s, color .25s; padding:0 }
    .arrow svg { width:18px; height:18px }
    .arrow:hover, .arrow:focus-visible { background:#fff; color:#000 }

    .dots { position:absolute; right:calc(var(--pad-x) - 7px); top:49.4%; transform:translateY(-50%); display:flex; flex-direction:column; gap:33px; margin:0; padding:0 }
    .dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; background:#fff; cursor:pointer; transition:background .25s; padding:0 }
    .dot.active { background:transparent }

    .tagline { position:absolute; left:var(--pad-x); bottom:clamp(40px,7.5vh,70px); margin:0; max-width:15em; font-size:clamp(24px,2.65vw,44px); line-height:1.2; font-weight:300; letter-spacing:-0.01em }
    .tagline strong { font-weight:700; display:block }
    .cta-row { position:absolute; left:45.6%; right:-1vw; top:88.7%; transform:translateY(-50%); display:flex; align-items:center }
    .cta { flex:none; padding:0 15px; height:48px; display:inline-flex; align-items:center; border:1.5px solid rgba(255,255,255,.85); border-radius:6px; background:rgba(0,0,0,.15); color:#fff; font-size:14px; font-weight:400; text-decoration:none; cursor:pointer; transition:background .25s, color .25s }
    .cta:hover, .cta:focus-visible { background:#fff; color:#000 }
    .cta-line { flex:1; height:1.5px; background:rgba(255,255,255,.8); min-width:40px }
    .count { flex:none; font-size:clamp(140px,19.8vw,360px); font-weight:400; line-height:1; letter-spacing:-0.02em; color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.9); transform:translateY(6%); user-select:none }
    .loader { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:.6; transition:opacity .6s }
    .loader.done { opacity:0 }
    button:focus-visible, a:focus-visible { outline:2px solid #fff; outline-offset:4px }

    @media (max-width:900px), (max-aspect-ratio:1/1) {
      .arrows { left:auto; right:var(--pad-x); top:15%; transform:translateY(-50%); gap:14px }
      .tagline { bottom:clamp(150px,20vh,220px) }
      .cta-row { left:var(--pad-x); right:-3vw; top:auto; bottom:24px; transform:none }
      .count { font-size:clamp(120px,22vw,200px) }
      body.embed .tagline { bottom:clamp(140px,22vh,220px); font-size:clamp(19px,4.8vw,30px) }
    }
    @media (max-width:640px) {
      .nav-links { gap:16px }
      .nav-links a, .logo { font-size:13px }
      .dots { gap:20px; right:16px }
      .dot { width:10px; height:10px }
      .cta-row { right:-8vw }
      .count { font-size:120px }
    }
    @media (max-width:420px) { .nav-links li:nth-child(2) { display:none } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { scroll-behavior:auto !important; transition-duration:.01ms !important; animation-duration:.01ms !important } }
    body.embed .nav { display:none }
    body.embed .arrows { top:14%; left:auto; right:var(--pad-x); transform:translateY(-50%); gap:14px }
    body.embed .tagline { bottom:clamp(74px,10vh,120px); font-size:clamp(20px,2.4vw,34px) }
    body.embed .cta-row { top:auto; left:auto; right:-2vw; bottom:24px; transform:none }
    body.embed .count { font-size:clamp(120px,18vw,280px) }
    @media (max-width:900px), (max-aspect-ratio:1/1) { body.embed .tagline { bottom:clamp(140px,22vh,220px); font-size:clamp(19px,4.8vw,30px) } }
    body.landing .tagline { top:clamp(28px,6vh,64px); bottom:auto; left:50%; width:min(92vw,720px); transform:translateX(-50%); text-align:center; font-size:clamp(18px,2.5vw,32px); line-height:1.45 }
    body.landing .tagline strong { display:inline }
    html.external-background, .external-background body, .external-background .hero { background:transparent }
    .external-background #waves { display:none }
    .external-background .tagline { text-shadow:0 2px 14px #000, 0 0 32px #000 }
    .external-background .cta { background:rgba(0,0,0,.72); backdrop-filter:blur(8px) }
    .external-background .cta:hover, .external-background .cta:focus-visible { background:#fff }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="waves" aria-hidden="true"></canvas>
    <canvas id="scene" aria-label="可拖拽旋转的玻璃立方体"></canvas>
    <div class="ui">
      <h1 class="sr-only">选对赛道，做成成果</h1>
      <header class="nav">
        <a href="#" class="logo" aria-label="知策台首页"><i class="logo-mark" aria-hidden="true"></i><b>知策</b><span>台</span></a>
        <ul class="nav-links">
          <li><a href="#hero">项目首页</a></li>
          <li><a href="#portfolio">画像与选赛</a></li>
          <li><a href="#contact">定题与依据</a></li>
        </ul>
      </header>
      <div class="arrows" aria-label="旋转立方体">
        <button class="arrow" id="prev" aria-label="向左旋转"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6" /></svg></button>
        <button class="arrow" id="next" aria-label="向右旋转"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg></button>
      </div>
      <nav class="dots" aria-label="备赛阶段">
        <button class="dot" aria-label="第 1 个备赛阶段"></button>
        <button class="dot active" aria-label="第 2 个备赛阶段" aria-current="true"></button>
        <button class="dot" aria-label="第 3 个备赛阶段"></button>
      </nav>
      <p class="tagline">从专业与真实资源出发<br>让每步备赛都有 <strong>依据。</strong></p>
      <div class="cta-row">
        <a href="#explore" class="cta">进入备赛工作台</a>
        <span class="cta-line" aria-hidden="true"></span>
        <span class="count" aria-hidden="true">01</span>
      </div>
      <div class="loader" id="loader" aria-live="polite">正在加载模型…</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL = 'https://motionsites.org/assets/prompt-media/fa96096e78c8153a70d2.glb';
    const canvas = document.getElementById('scene');
    const loaderText = document.getElementById('loader');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const dots = [...document.querySelectorAll('.dot')];
    const hero = document.getElementById('hero');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const queryParams = new URLSearchParams(window.location.search);
    const isLanding = queryParams.has('landing');
    const hasExternalBackground = document.documentElement.classList.contains('external-background');
    if (queryParams.has('embed')) document.body.classList.add('embed');
    if (isLanding) { document.body.classList.add('landing'); document.querySelector('.sr-only').textContent = '知策台'; }

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:hasExternalBackground, powerPreference:'high-performance' });
    } catch (error) {
      loaderText.textContent = 'WebGL unavailable';
      console.error(error);
    }
    if (!renderer) throw new Error('WebGL renderer unavailable');
    renderer.setClearColor(0x000000, hasExternalBackground ? 0 : 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);

    const wavesCanvas = document.getElementById('waves');
    const wavesCtx = wavesCanvas.getContext('2d');
    let wavesW = window.innerWidth;
    let wavesH = window.innerHeight;
    function resizeWaves(){
      if (hasExternalBackground) return;
      wavesW=window.innerWidth; wavesH=window.innerHeight;
      const waveDpr=Math.min(window.devicePixelRatio||1,2);
      wavesCanvas.width=Math.max(1,Math.floor(wavesW*waveDpr)); wavesCanvas.height=Math.max(1,Math.floor(wavesH*waveDpr));
      wavesCtx.setTransform(waveDpr,0,0,waveDpr,0,0);
    }
    function drawWaves(time=0){
      wavesCtx.clearRect(0,0,wavesW,wavesH);
      const spacing=Math.max(16,Math.min(24,wavesW/64));
      const columns=Math.ceil(wavesW/spacing)+2;
      const rows=Math.ceil(wavesH/spacing*0.92);
      const horizon=wavesH*0.10;
      const t=time*0.00065;
      for(let row=0;row<rows;row++){
        const depth=row/Math.max(1,rows-1);
        const baseY=horizon+depth*wavesH*0.92;
        for(let col=-1;col<columns;col++){
          const x=col*spacing+((row&1)*spacing*0.5);
          const wave=Math.sin(x*0.018+t*2.2+row*0.28)*10+Math.sin(x*0.008-t*1.4+row*0.13)*7;
          const y=baseY+wave*(0.45+depth*2.1);
          const edge=1-Math.min(1,Math.abs(x-wavesW*0.5)/(wavesW*0.70));
          const alpha=(0.08+depth*0.34)*Math.max(0.22,edge);
          wavesCtx.fillStyle=`rgba(94,190,255,${alpha})`;
          wavesCtx.beginPath(); wavesCtx.arc(x,y,0.65+depth*1.05,0,Math.PI*2); wavesCtx.fill();
          if (depth > 0.2) {
            wavesCtx.fillStyle=`rgba(218,244,255,${alpha*0.28})`;
            wavesCtx.beginPath(); wavesCtx.arc(x,y,0.32+depth*0.48,0,Math.PI*2); wavesCtx.fill();
          }
        }
      }
    }
    if (!hasExternalBackground) {
      resizeWaves();
      requestAnimationFrame(function animateWaves(time){ drawWaves(time); if(!prefersReducedMotion) requestAnimationFrame(animateWaves); });
    }

    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);
    const scene = new THREE.Scene();
    const pivot = new THREE.Group();
    const spinner = new THREE.Group();
    pivot.add(spinner);
    scene.add(pivot);

    const bgScene = new THREE.Scene();
    const bgCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const bgTexture = new THREE.CanvasTexture(bgCanvas);
    bgTexture.colorSpace = THREE.SRGBColorSpace;
    bgTexture.minFilter = THREE.LinearFilter;
    bgTexture.magFilter = THREE.LinearFilter;
    bgTexture.generateMipmaps = false;
    const bgMaterial = new THREE.ShaderMaterial({
      uniforms: { uTex: { value:bgTexture } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
      fragmentShader: `uniform sampler2D uTex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(uTex,vUv);\n#include <colorspace_fragment> }`,
      depthTest:false, depthWrite:false, frustumCulled:false, transparent:hasExternalBackground
    });
    const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
    bgQuad.frustumCulled = false;
    bgScene.add(bgQuad);

    const frontUniforms = {
      uTexture:{value:null}, uResolution:{value:new THREE.Vector2(1,1)},
      uIorR:{value:1.15}, uIorY:{value:1.16}, uIorG:{value:1.18}, uIorC:{value:1.22}, uIorB:{value:1.22}, uIorP:{value:1.22},
      uRefractPower:{value:0.30}, uChromatic:{value:0.5}, uSaturation:{value:1.08}, uShininess:{value:90}, uDiffuseness:{value:0.02}, uFresnelPower:{value:5.0}, uLight:{value:new THREE.Vector3(-1,1,1)}, uBackside:{value:0}
    };
    const backUniforms = THREE.UniformsUtils.clone(frontUniforms);
    backUniforms.uRefractPower.value = 0.22;
    backUniforms.uBackside.value = 1;
    const vertexShader = `varying vec3 vNormal; varying vec3 vEye; void main(){ vec4 worldPos=modelMatrix*vec4(position,1.0); vec4 mvPos=viewMatrix*worldPos; gl_Position=projectionMatrix*mvPos; vNormal=normalize(normalMatrix*normal); vEye=normalize(mvPos.xyz); }`;
    const fragmentShader = `
      uniform sampler2D uTexture; uniform vec2 uResolution;
      uniform float uIorR,uIorY,uIorG,uIorC,uIorB,uIorP,uRefractPower,uChromatic,uSaturation,uShininess,uDiffuseness,uFresnelPower,uBackside;
      uniform vec3 uLight; varying vec3 vNormal; varying vec3 vEye;
      float specular(vec3 n, vec3 light, vec3 viewDir, float shininess, float diffuseness){ vec3 halfVec=normalize(light+viewDir); return pow(max(dot(n,halfVec),0.0),shininess)+max(dot(n,light),0.0)*diffuseness; }
      void main(){
        vec2 uv=gl_FragCoord.xy/uResolution; vec3 n=normalize(vNormal); if(uBackside>0.5) n=-n; vec3 eye=normalize(vEye); float LOOP=16.0; vec3 color=vec3(0.0);
        for(int i=0;i<16;i++){ float slide=float(i)/LOOP*0.045; vec2 offR=refract(eye,n,1.0/uIorR).xy*(uRefractPower+slide*1.0)*uChromatic; vec2 offY=refract(eye,n,1.0/uIorY).xy*(uRefractPower+slide*1.0)*uChromatic; vec2 offG=refract(eye,n,1.0/uIorG).xy*(uRefractPower+slide*2.0)*uChromatic; vec2 offC=refract(eye,n,1.0/uIorC).xy*(uRefractPower+slide*2.5)*uChromatic; vec2 offB=refract(eye,n,1.0/uIorB).xy*(uRefractPower+slide*3.0)*uChromatic; vec2 offP=refract(eye,n,1.0/uIorP).xy*(uRefractPower+slide*1.0)*uChromatic;
          vec4 txR=texture2D(uTexture,clamp(uv+offR,0.001,0.999)); vec4 txY=texture2D(uTexture,clamp(uv+offY,0.001,0.999)); vec4 txG=texture2D(uTexture,clamp(uv+offG,0.001,0.999)); vec4 txC=texture2D(uTexture,clamp(uv+offC,0.001,0.999)); vec4 txB=texture2D(uTexture,clamp(uv+offB,0.001,0.999)); vec4 txP=texture2D(uTexture,clamp(uv+offP,0.001,0.999));
          float r=txR.r*0.5; float y=(txY.r*2.0+txY.g*2.0-txY.b)/6.0; float g=txG.g*0.5; float c=(txC.g*2.0+txC.b*2.0-txC.r)/6.0; float b=txB.b*0.5; float p=(txP.b*2.0+txP.r*2.0-txP.g)/6.0; color += vec3(r+(2.0*p+2.0*y-c)/3.0, g+(2.0*y+2.0*c-p)/3.0, b+(2.0*c+2.0*p-y)/3.0);
        }
        color/=LOOP; float luma=dot(color,vec3(0.2125,0.7154,0.0721)); color=mix(vec3(luma),color,uSaturation); vec3 lightVec=normalize(-uLight); vec3 viewDir=normalize(-eye); float spec=specular(n,lightVec,viewDir,uShininess,uDiffuseness)+0.6*specular(n,normalize(vec3(1.0,1.0,-1.0)),viewDir,uShininess*0.6,uDiffuseness*0.5); color += spec*(uBackside>0.5?0.35:1.0); float f=pow(1.0+dot(eye,n),uFresnelPower); color=mix(color,vec3(1.0),f*(uBackside>0.5?0.25:0.55)); color+=vec3(0.004,0.005,0.007); gl_FragColor=vec4(color,1.0);\n#include <colorspace_fragment> }
    `;
    const frontMat = new THREE.ShaderMaterial({ uniforms:frontUniforms, vertexShader, fragmentShader, side:THREE.FrontSide });
    const backMat = new THREE.ShaderMaterial({ uniforms:backUniforms, vertexShader, fragmentShader, side:THREE.BackSide });
    let cube = null;
    const rtBack = new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType, depthBuffer:true, stencilBuffer:false});
    const rtFront = new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType, depthBuffer:true, stencilBuffer:false});

    let W=window.innerWidth, H=window.innerHeight, mobile=false;
    let targetSpin=0, velocityX=0, velocityY=0, dragging=false, idleTime=0, idleBlend=0, lastT=performance.now(), lastX=0, lastY=0;
    const tmpQ = new THREE.Quaternion();
    const axisY = new THREE.Vector3(0,1,0), axisX = new THREE.Vector3(1,0,0);

    function drawHeadline(){
      const scale=dpr; bgCanvas.width=Math.max(1,Math.floor(W*scale)); bgCanvas.height=Math.max(1,Math.floor(H*scale)); bgCtx.setTransform(scale,0,0,scale,0,0);
      if (hasExternalBackground) { bgCtx.clearRect(0,0,W,H); } else { bgCtx.fillStyle='#000'; bgCtx.fillRect(0,0,W,H); }
      mobile=(W<768)||(W/H<1); let fs=Math.min(H*0.21,W*(mobile?0.21:0.118)); const maxWidth=W*(mobile?0.9:0.5); const headlineLines=isLanding?['知策台']:['选对','赛道','做成']; bgCtx.font=`800 ${fs}px "Noto Sans SC","Microsoft YaHei",sans-serif`; const widest=Math.max(...headlineLines.map(t=>bgCtx.measureText(t).width)); if(widest>maxWidth) fs*=maxWidth/widest; bgCtx.font=`800 ${fs}px "Noto Sans SC","Microsoft YaHei",sans-serif`; bgCtx.fillStyle='#e9e9e9'; bgCtx.textAlign='center'; bgCtx.textBaseline='alphabetic'; const cx=W*(mobile?0.5:0.505), cy=H*(mobile?0.45:0.468), cap=fs*0.7, gap=fs*1.07, lineOffset=(headlineLines.length-1)/2; headlineLines.forEach((line,i)=>bgCtx.fillText(line,cx,cy+cap/2+(i-lineOffset)*gap)); bgTexture.needsUpdate=true;
    }
    function layout(){
      W=window.innerWidth; H=window.innerHeight; resizeWaves(); mobile=(W<768)||(W/H<1); renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix(); const dbW=Math.max(1,Math.floor(W*dpr)), dbH=Math.max(1,Math.floor(H*dpr)); rtBack.setSize(dbW,dbH); rtFront.setSize(dbW,dbH); frontUniforms.uResolution.value.set(dbW,dbH); backUniforms.uResolution.value.set(dbW,dbH); frontUniforms.uTexture.value=rtFront.texture; backUniforms.uTexture.value=rtBack.texture; drawHeadline(); const visH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*10, visW=visH*(W/H), sx=mobile?0.5:0.517, sy=mobile?0.45:0.488, px=Math.min(H*0.44,W*(mobile?0.45:0.29)); pivot.position.set((sx-0.5)*visW,(0.5-sy)*visH,0); pivot.scale.setScalar((px/H)*visH);
    }
    function makeCube(geometry){
      geometry.deleteAttribute('uv'); geometry.deleteAttribute('color'); geometry.deleteAttribute('tangent'); geometry=mergeVertices(geometry,1e-4); geometry.computeVertexNormals(); geometry.computeBoundingBox(); const center=geometry.boundingBox.getCenter(new THREE.Vector3()); geometry.translate(-center.x,-center.y,-center.z); geometry.computeBoundingBox(); const size=geometry.boundingBox.getSize(new THREE.Vector3()); geometry.scale(1/Math.max(size.x,size.y,size.z),1/Math.max(size.x,size.y,size.z),1/Math.max(size.x,size.y,size.z)); cube=new THREE.Mesh(geometry,frontMat); spinner.add(cube); spinner.rotation.set(-0.42,0.62,0.18); loaderText.classList.add('done'); layout();
    }
    const gltfLoader=new GLTFLoader();
    gltfLoader.load(MODEL_URL,(gltf)=>{ const parts=[]; gltf.scene.updateMatrixWorld(true); gltf.scene.traverse((m)=>{ if(m.isMesh){ let g=m.geometry.clone(); g.applyMatrix4(m.matrixWorld); parts.push(g); } }); let g=parts.length>1?mergeGeometries(parts,false):parts[0]; if(!g) g=new RoundedBoxGeometry(1,1,1,8,0.12); makeCube(g); }, undefined, ()=>{ makeCube(new RoundedBoxGeometry(1,1,1,8,0.12)); });

    function applyRotation(dx,dy){ tmpQ.setFromAxisAngle(axisY,dx); spinner.quaternion.premultiply(tmpQ); tmpQ.setFromAxisAngle(axisX,dy); spinner.quaternion.premultiply(tmpQ); }
    canvas.addEventListener('pointerdown',(e)=>{ if(!cube) return; dragging=true; canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId); lastX=e.clientX; lastY=e.clientY; velocityX=velocityY=0; targetSpin=0; idleTime=0; });
    canvas.addEventListener('pointermove',(e)=>{ if(!dragging) return; const dx=(e.clientX-lastX)*0.008, dy=(e.clientY-lastY)*0.008; lastX=e.clientX; lastY=e.clientY; velocityY=dx; velocityX=dy; applyRotation(dx,dy); });
    function releasePointer(e){ if(!dragging) return; dragging=false; canvas.classList.remove('dragging'); if(canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); idleTime=0; }
    canvas.addEventListener('pointerup',releasePointer); canvas.addEventListener('pointercancel',releasePointer); canvas.addEventListener('pointerleave',(e)=>{ if(dragging && e.pointerType==='mouse') releasePointer(e); });
    prev.addEventListener('click',()=>{ targetSpin-=Math.PI/2; velocityX=velocityY=0; idleTime=0; }); next.addEventListener('click',()=>{ targetSpin+=Math.PI/2; velocityX=velocityY=0; idleTime=0; });
    dots.forEach((dot)=>dot.addEventListener('click',()=>{ dots.forEach((d)=>{ d.classList.remove('active'); d.removeAttribute('aria-current'); }); dot.classList.add('active'); dot.setAttribute('aria-current','true'); }));
    document.querySelector('.cta')?.addEventListener('click',(event)=>{ if(document.body.classList.contains('embed')){ event.preventDefault(); window.parent.postMessage({type:'zhice-world-action',action:'enter-workspace'},window.location.origin); } });
    window.addEventListener('resize',layout); document.fonts?.addEventListener('loadingdone',drawHeadline);

    function render(){
      renderer.setRenderTarget(rtBack); renderer.autoClear=true; renderer.clear(); renderer.render(bgScene,bgCamera);
      renderer.setRenderTarget(rtFront); renderer.clear(); renderer.render(bgScene,bgCamera); if(cube){ cube.material=backMat; renderer.autoClear=false; renderer.render(scene,camera); }
      renderer.setRenderTarget(null); renderer.clear(); renderer.render(bgScene,bgCamera); if(cube){ renderer.clearDepth(); cube.material=frontMat; renderer.autoClear=false; renderer.render(scene,camera); } renderer.autoClear=true;
    }
    function animate(now){ const dt=Math.min(0.05,Math.max(0.001,(now-lastT)/1000)); lastT=now; if(cube&&!dragging){ if(Math.abs(targetSpin)>0.0005){ const step=targetSpin*Math.min(1,0.09*dt*60); applyRotation(0,step*0); tmpQ.setFromAxisAngle(axisY,step); spinner.quaternion.premultiply(tmpQ); targetSpin-=step; } else { applyRotation(velocityY,velocityX); const damp=Math.pow(0.94,dt*60); velocityX*=damp; velocityY*=damp; idleTime+=dt; if(idleTime>0.6&&!prefersReducedMotion){ idleBlend=Math.min(1,idleBlend+dt); applyRotation(0.0012*dt*60*idleBlend,0.0035*dt*60*idleBlend); } } } render(); requestAnimationFrame(animate); }
    Promise.race([Promise.all([document.fonts?.load('800 100px "Noto Sans SC"'),document.fonts?.ready]),new Promise((resolve)=>setTimeout(resolve,2500))]).then(()=>{ layout(); requestAnimationFrame(animate); });
  </script>
</body>
</html>
